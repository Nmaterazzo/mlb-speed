<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLB Sprint Speed</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0c0f;--bg2:#0f1117;--bg3:#161b22;--bg4:#1c2230;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#e8eaf0;--muted:#6b7385;--dim:#3a4255;
  --accent:#00e5ff;--accent2:#00b8d9;
  --green:#00e676;--orange:#ff9800;--red:#ff5252;--gold:#ffd740;
  --fd:'Bebas Neue',sans-serif;--fu:'Barlow Condensed',sans-serif;--fm:'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Barlow Condensed',sans-serif;font-size:15px;line-height:1.5;min-height:100vh;}

.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;gap:16px;height:52px;position:sticky;top:0;z-index:100;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--accent);letter-spacing:2px;white-space:nowrap;}
.logo span{color:var(--muted);font-size:18px;margin-left:6px;}
.hdr-stats{display:flex;gap:20px;margin-left:auto;font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);}
.hdr-stats b{color:var(--accent);font-weight:400;}

.app{display:flex;height:calc(100vh - 52px);overflow:hidden;}

.left{width:440px;min-width:400px;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg2);}
.controls{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px;}
.row{display:flex;gap:7px;align-items:center;}
.sw{position:relative;flex:1;}
.si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
input[type=text]{width:100%;background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-family:'Barlow Condensed',sans-serif;font-size:13px;padding:7px 8px 7px 28px;border-radius:5px;outline:none;transition:border-color .2s;}
input[type=text]:focus{border-color:var(--accent);}
input[type=text]::placeholder{color:var(--muted);}
select{background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-family:'Barlow Condensed',sans-serif;font-size:13px;padding:7px 8px;border-radius:5px;outline:none;cursor:pointer;}
select:focus{border-color:var(--accent);}

.yr-wrap{display:flex;align-items:center;gap:6px;font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);}
.yr-wrap span{white-space:nowrap;}
.yr-wrap select{padding:4px 6px;font-size:12px;}
.btn-apply{background:rgba(0,229,255,.15);border:1px solid rgba(0,229,255,.35);color:var(--accent);font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;padding:3px 10px;border-radius:4px;cursor:pointer;letter-spacing:.4px;}
.btn-apply:hover{background:rgba(0,229,255,.25);}

.tier-btns{display:flex;gap:3px;flex-wrap:wrap;}
.tf{background:var(--bg3);border:1px solid var(--border);color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;letter-spacing:.4px;padding:3px 9px;border-radius:4px;cursor:pointer;transition:all .15s;}
.tf:hover{border-color:var(--border2);color:var(--text);}
.tf.active{background:rgba(0,229,255,.12);border-color:var(--accent);color:var(--accent);}

.cmp-bar{display:flex;align-items:center;gap:7px;padding:7px 14px;background:rgba(0,229,255,.05);border-bottom:1px solid rgba(0,229,255,.15);font-size:12px;font-weight:600;color:var(--accent);}
.cmp-bar.hidden{display:none;}
.cmp-pills{display:flex;gap:5px;flex-wrap:wrap;flex:1;}
.cmp-pill{background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.25);color:var(--accent);font-family:'DM Mono',monospace;font-size:10px;padding:2px 7px 2px 9px;border-radius:20px;display:flex;align-items:center;gap:5px;}
.cmp-pill button{background:none;border:none;color:var(--accent2);cursor:pointer;font-size:13px;line-height:1;padding:0;}
.btn-cgo{background:var(--accent);border:none;color:var(--bg);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.4px;padding:4px 12px;border-radius:4px;cursor:pointer;white-space:nowrap;}
.btn-cgo:hover{background:var(--accent2);}
.btn-clr{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 3px;}

.lhdr{display:grid;grid-template-columns:34px 1fr 62px 56px 52px 38px;padding:6px 14px;background:var(--bg3);border-bottom:1px solid var(--border);font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;position:sticky;top:0;z-index:10;}
.plist{overflow-y:auto;flex:1;}
.plist::-webkit-scrollbar{width:3px;}
.plist::-webkit-scrollbar-thumb{background:var(--dim);border-radius:2px;}

.prow{display:grid;grid-template-columns:34px 1fr 62px 56px 52px 38px;padding:9px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;align-items:center;}
.prow:hover{background:var(--bg3);}
.prow.sel{background:rgba(0,229,255,.05);border-left:2px solid var(--accent);}
.prow.incmp{background:rgba(0,229,255,.03);}
.rnum{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);}
.rnum.t3{color:var(--gold);}
.pnc{display:flex;flex-direction:column;gap:1px;overflow:hidden;}
.pname{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pmeta{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);display:flex;gap:5px;}
.scol{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;text-align:right;}
.se{color:var(--green)}.sp{color:#76ff03}.sa{color:#c6ff00}.sv{color:var(--text)}.sb{color:var(--orange)}.ss{color:var(--red)}
.bcol{display:flex;align-items:center;padding:0 6px;}
.bt{flex:1;height:3px;background:var(--dim);border-radius:2px;overflow:hidden;}
.bf{height:100%;border-radius:2px;transition:width .4s;}
.pcol{font-family:'DM Mono',monospace;font-size:11px;text-align:right;color:var(--muted);}
.acb{background:none;border:1px solid var(--border);color:var(--muted);font-size:14px;width:22px;height:22px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;margin-left:auto;line-height:1;}
.acb:hover{border-color:var(--accent);color:var(--accent);}
.acb.added{border-color:var(--accent);color:var(--accent);background:rgba(0,229,255,.1);}

.right{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px;}
.right::-webkit-scrollbar{width:3px;}
.right::-webkit-scrollbar-thumb{background:var(--dim);border-radius:2px;}

.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:10px;text-align:center;}
.empty h3{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:var(--dim);}
.empty p{font-size:12px;max-width:260px;line-height:1.6;}

.card{background:var(--bg3);border:1px solid var(--border2);border-radius:9px;padding:18px 20px;}
.card.ab{border-color:rgba(0,229,255,.2);}

.hero{display:flex;gap:20px;align-items:flex-start;}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--bg4);border:2px solid var(--border2);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.av-init{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--muted);}
.hero-info{flex:1;}
.hero-name{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px;line-height:1;margin-bottom:5px;}
.hero-sub{display:flex;gap:14px;font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);flex-wrap:wrap;}
.hero-sub span{color:var(--text);font-weight:500;}
.speed-hero{text-align:right;flex-shrink:0;}
.spd-val{font-family:'Bebas Neue',sans-serif;font-size:64px;line-height:1;letter-spacing:2px;}
.spd-lbl{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}

.sgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.sc{background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:12px 14px;}
.slbl{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;}
.sval{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:1px;line-height:1;}
.sctx{font-size:11px;color:var(--muted);margin-top:2px;}

.pct-track{height:24px;border-radius:12px;background:linear-gradient(90deg,var(--red) 0%,var(--orange) 25%,#c6ff00 50%,#76ff03 75%,var(--green) 100%);position:relative;}
.pct-marker{position:absolute;top:-5px;transform:translateX(-50%);width:3px;height:34px;background:white;border-radius:2px;transition:left .5s;box-shadow:0 0 6px rgba(255,255,255,.5);}
.pct-labels{display:flex;justify-content:space-between;margin-top:6px;font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);}
.pct-val{text-align:center;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;margin-top:10px;}

.stitle{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;color:var(--muted);margin-bottom:14px;text-transform:uppercase;}
.chart-wrap{position:relative;height:150px;margin-top:6px;}
canvas{width:100%;height:100%;}

/* Season table */
.stbl{width:100%;border-collapse:collapse;font-size:13px;}
.stbl th{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:6px 10px;border-bottom:1px solid var(--border);text-align:left;}
.stbl td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
.stbl tr:last-child td{border-bottom:none;}
.stbl tr:hover td{background:rgba(255,255,255,.02);}
.tbar-wrap{width:120px;}
.tbar-track{height:4px;background:var(--dim);border-radius:2px;overflow:hidden;}
.tbar-fill{height:100%;border-radius:2px;}
.delta{font-family:'DM Mono',monospace;font-size:11px;}
.delta.pos{color:var(--green);}
.delta.neg{color:var(--red);}

/* Compare */
.cmp-hdr-grid{display:grid;gap:10px;margin-bottom:16px;}
.cmp-pcol{text-align:center;padding:12px;background:var(--bg4);border-radius:7px;border:1px solid var(--border);}
.cmp-name{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cmp-spd{font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:2px;line-height:1;margin:3px 0;}
.cmp-meta{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);}
.cmp-srow{display:grid;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);gap:8px;}
.cmp-srow:last-child{border-bottom:none;}
.cmp-slbl{text-align:center;font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
.cmp-sv{text-align:center;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.5px;}
.cmp-sv.win{color:var(--green);}
.cmp-sv.los{color:var(--muted);}

.loading{display:flex;align-items:center;justify-content:center;padding:32px;color:var(--muted);font-family:'DM Mono',monospace;font-size:12px;gap:8px;}
.spin{width:14px;height:14px;border:2px solid var(--dim);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.errmsg{background:rgba(255,82,82,.08);border:1px solid rgba(255,82,82,.2);border-radius:7px;padding:14px;color:var(--red);font-family:'DM Mono',monospace;font-size:12px;text-align:center;}
</style>
</head>
<body>

<div class="header">
  <div class="logo">MLB SPRINT SPEED <span>/ STATCAST</span></div>
  <div class="hdr-stats">
    <div id="hdr-s">SEASON: <b>—</b></div>
    <div id="hdr-c">PLAYERS: <b>—</b></div>
    <div id="hdr-a">LG AVG: <b>—</b> ft/s</div>
    <div id="hdr-m">FASTEST: <b>—</b> ft/s</div>
  </div>
</div>

<div class="app">
  <div class="left">
    <div class="controls">
      <div class="row">
        <div class="sw">
          <svg class="si" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="srch" placeholder="Search player or team…">
        </div>
        <select id="season-sel"></select>
      </div>
      <div class="row yr-wrap">
        <span>TREND RANGE:</span>
        <select id="yr-from"></select>
        <span>→</span>
        <select id="yr-to"></select>
        <button class="btn-apply" id="btn-apply">APPLY</button>
        <select id="pos-f" style="margin-left:auto;font-size:11px;padding:4px 6px;">
          <option value="">ALL POS</option>
          <option value="C">C</option><option value="1B">1B</option><option value="2B">2B</option>
          <option value="3B">3B</option><option value="SS">SS</option><option value="LF">LF</option>
          <option value="CF">CF</option><option value="RF">RF</option><option value="OF">OF</option>
          <option value="DH">DH</option><option value="P">P</option>
        </select>
      </div>
      <div class="row">
        <div class="tier-btns" id="tier-btns">
          <button class="tf active" data-tier="all">ALL</button>
          <button class="tf" data-tier="elite">ELITE 30+</button>
          <button class="tf" data-tier="plus">PLUS 28+</button>
          <button class="tf" data-tier="avg">AVG</button>
          <button class="tf" data-tier="below">BELOW</button>
        </div>
      </div>
    </div>

    <div class="cmp-bar hidden" id="cmp-bar">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
      <div class="cmp-pills" id="cmp-pills"></div>
      <button class="btn-cgo" id="btn-cgo">COMPARE →</button>
      <button class="btn-clr" id="btn-clr">✕</button>
    </div>

    <div class="lhdr">
      <div>#</div><div>PLAYER</div><div style="text-align:right">FT/S</div>
      <div></div><div style="text-align:right">PCT</div><div></div>
    </div>
    <div class="plist" id="plist">
      <div class="loading"><div class="spin"></div> Loading…</div>
    </div>
  </div>

  <div class="right" id="right">
    <div class="empty">
      <div style="font-size:44px;opacity:.3">🏃</div>
      <h3>SELECT A PLAYER</h3>
      <p>Click any player to view their sprint speed profile, percentile, and career season-by-season breakdown.</p>
      <p style="color:var(--accent);font-size:11px;font-family:'DM Mono',monospace;margin-top:6px">Use + to compare up to 4 players</p>
    </div>
  </div>
</div>

<script>
const API = 'https://mlb-speed-worker.nmaterazzo2435.workers.dev';
const COLORS = ['#00e5ff','#ff9800','#ce93d8','#00e676'];

let allPlayers = [], filtered = [], selPlayer = null;
let compareList = [], isCompare = false;
let curSeason = 2026, lgAvg = 27, lgMax = 31, lgMin = 24;

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init() {
  await loadSeasons();
  await loadLeaderboard(curSeason);
}

async function loadSeasons() {
  try {
    const d = await apiFetch('/api/seasons');
    const seasons = d.seasons || [];
    const sel = document.getElementById('season-sel');
    const yf = document.getElementById('yr-from');
    const yt = document.getElementById('yr-to');
    seasons.slice().reverse().forEach(yr => {
      [sel, yf, yt].forEach(el => {
        const o = document.createElement('option');
        o.value = yr; o.textContent = yr; el.appendChild(o);
      });
    });
    sel.value = 2026; yf.value = 2015; yt.value = 2026;
    sel.addEventListener('change', () => {
      curSeason = parseInt(sel.value);
      selPlayer = null; compareList = []; updateCmpBar();
      loadLeaderboard(curSeason);
    });
  } catch(e) { console.error(e); }
}

async function loadLeaderboard(season) {
  document.getElementById('plist').innerHTML = '<div class="loading"><div class="spin"></div> Fetching from Baseball Savant…</div>';
  try {
    const d = await apiFetch(`/api/leaderboard?season=${season}`);
    allPlayers = d.players || [];
    lgAvg = d.league_avg || 27; lgMax = d.max || 31; lgMin = d.min || 24;
    document.querySelector('#hdr-s b').textContent = d.season;
    document.querySelector('#hdr-c b').textContent = d.count.toLocaleString();
    document.querySelector('#hdr-a b').textContent = lgAvg.toFixed(1);
    document.querySelector('#hdr-m b').textContent = lgMax.toFixed(1);
    applyFilters();
  } catch(e) {
    document.getElementById('plist').innerHTML = `<div class="errmsg" style="margin:16px">⚠ ${e.message}</div>`;
  }
}

// ── FILTERS ───────────────────────────────────────────────────────────────────
function applyFilters() {
  const q = document.getElementById('srch').value.toLowerCase().trim();
  const tier = document.querySelector('.tf.active')?.dataset.tier || 'all';
  const pos = document.getElementById('pos-f').value;
  filtered = allPlayers.filter(p => {
    if (q && !p.name.toLowerCase().includes(q) && !p.team.toLowerCase().includes(q)) return false;
    if (pos && p.position !== pos) return false;
    if (tier === 'elite' && p.sprint_speed < 30) return false;
    if (tier === 'plus' && p.sprint_speed < 28) return false;
    if (tier === 'avg' && (p.sprint_speed < 26 || p.sprint_speed > 28)) return false;
    if (tier === 'below' && p.sprint_speed >= 26) return false;
    return true;
  });
  renderList();
}

// ── RENDER LIST ───────────────────────────────────────────────────────────────
function renderList() {
  const list = document.getElementById('plist');
  if (!filtered.length) { list.innerHTML = '<div class="loading" style="color:var(--muted)">No players match</div>'; return; }
  const frag = document.createDocumentFragment();
  filtered.forEach(p => {
    const row = document.createElement('div');
    row.className = 'prow' + (selPlayer?.player_id === p.player_id ? ' sel' : '') + (compareList.some(c => c.player_id === p.player_id) ? ' incmp' : '');
    const sc = spClass(p.sprint_speed);
    const bp = Math.max(0, Math.min(100, ((p.sprint_speed - lgMin) / (lgMax - lgMin) * 100))).toFixed(1);
    const inC = compareList.some(c => c.player_id === p.player_id);
    row.innerHTML = `
      <div class="rnum ${p.rank<=3?'t3':''}">${p.rank<=3?['🥇','🥈','🥉'][p.rank-1]:p.rank}</div>
      <div class="pnc">
        <div class="pname">${p.name}</div>
        <div class="pmeta"><span>${p.team||'—'}</span>${p.position?`<span>${p.position}</span>`:''}</div>
      </div>
      <div class="scol ${sc}">${p.sprint_speed?.toFixed(1)||'—'}</div>
      <div class="bcol"><div class="bt"><div class="bf" style="width:${bp}%;background:${barColor(p.sprint_speed)}"></div></div></div>
      <div class="pcol">${p.percentile?Math.round(p.percentile)+'th':'—'}</div>
      <div style="display:flex;justify-content:flex-end">
        <button class="acb ${inC?'added':''}" data-id="${p.player_id}">${inC?'✓':'+'}</button>
      </div>`;
    row.addEventListener('click', e => { if(e.target.closest('.acb')) return; selectPlayer(p); });
    row.querySelector('.acb').addEventListener('click', e => { e.stopPropagation(); toggleCompare(p); });
    frag.appendChild(row);
  });
  list.innerHTML = ''; list.appendChild(frag);
}

// ── SELECT PLAYER ─────────────────────────────────────────────────────────────
async function selectPlayer(p) {
  selPlayer = p; isCompare = false;
  renderList();
  await renderDetail(p);
}

async function renderDetail(p) {
  const panel = document.getElementById('right');
  panel.innerHTML = '<div class="loading" style="padding:60px"><div class="spin"></div> Loading…</div>';

  const yrFrom = parseInt(document.getElementById('yr-from').value) || 2015;
  const yrTo   = parseInt(document.getElementById('yr-to').value)   || 2026;

  // Always fetch full career trend (all years), filter display by range
  const trendData = await apiFetch(`/api/player?id=${p.player_id}&season=2026`).catch(() => ({season_trend:[]}));
  const fullTrend = trendData.season_trend || [];
  const rangedTrend = fullTrend.filter(d => d.season >= yrFrom && d.season <= yrTo);

  const sc = spClass(p.sprint_speed);
  const init = p.name.split(' ').map(n=>n[0]).join('').slice(0,2);
  const pct = p.percentile ? Math.round(p.percentile) : 50;
  const pctL = Math.max(2, Math.min(96, pct));
  const diffAvg = p.sprint_speed ? (p.sprint_speed - lgAvg).toFixed(1) : '—';
  const diffSign = parseFloat(diffAvg) >= 0 ? '+' : '';

  // Build season-by-season table from trend data filtered to range
  const trendForTable = rangedTrend.slice().reverse(); // most recent first
  const speeds = trendForTable.map(d => d.sprint_speed);
  const maxSpd = speeds.length ? Math.max(...speeds) : 0;
  const minSpd = speeds.length ? Math.min(...speeds) : 0;

  const seasonTableHTML = trendForTable.length ? `
    <table class="stbl">
      <thead><tr><th>SEASON</th><th>SPRINT SPEED</th><th></th><th>VS LG AVG</th><th>YoY</th></tr></thead>
      <tbody>${trendForTable.map((d, i) => {
        const prev = trendForTable[i+1];
        const yoy = prev ? (d.sprint_speed - prev.sprint_speed).toFixed(1) : null;
        const yoyCls = yoy ? (parseFloat(yoy) >= 0 ? 'pos' : 'neg') : '';
        const yoyStr = yoy ? (parseFloat(yoy) >= 0 ? '+' : '') + yoy : '—';
        const diff = (d.sprint_speed - lgAvg).toFixed(1);
        const diffCls = parseFloat(diff) >= 0 ? 'pos' : 'neg';
        const barW = speeds.length > 1 ? Math.round(((d.sprint_speed - minSpd) / (maxSpd - minSpd)) * 100) : 100;
        return `<tr>
          <td style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)">${d.season}</td>
          <td><span class="scol ${spClass(d.sprint_speed)}" style="font-size:18px">${d.sprint_speed.toFixed(1)}</span></td>
          <td class="tbar-wrap"><div class="tbar-track"><div class="tbar-fill" style="width:${barW}%;background:${barColor(d.sprint_speed)}"></div></div></td>
          <td class="delta ${diffCls}">${parseFloat(diff)>=0?'+':''}${diff}</td>
          <td class="delta ${yoyCls}">${yoyStr}</td>
        </tr>`;
      }).join('')}
      </tbody>
    </table>` : '<div style="color:var(--muted);font-family:\'DM Mono\',monospace;font-size:12px;text-align:center;padding:20px">No multi-season data available</div>';

  panel.innerHTML = `
    <div class="card hero">
      <div class="avatar">
        <img src="https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:67:current.png/w_180,q_100/v1/people/${p.player_id}/headshot/67/current"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="av-init" style="display:none">${init}</div>
      </div>
      <div class="hero-info">
        <div class="hero-name">${p.name}</div>
        <div class="hero-sub">
          TEAM: <span>${p.team||'—'}</span> &nbsp;·&nbsp;
          POS: <span>${p.position||'—'}</span> &nbsp;·&nbsp;
          AGE: <span>${p.age||'—'}</span> &nbsp;·&nbsp;
          RANK: <span>#${p.rank} of ${allPlayers.length}</span>
        </div>
      </div>
      <div class="speed-hero">
        <div class="spd-val ${sc}">${p.sprint_speed?.toFixed(1)||'—'}</div>
        <div class="spd-lbl">ft/sec · ${spTier(p.sprint_speed)}</div>
      </div>
    </div>

    <div class="sgrid">
      <div class="sc"><div class="slbl">Sprint Speed</div><div class="sval ${sc}">${p.sprint_speed?.toFixed(1)||'—'}</div><div class="sctx">ft / sec</div></div>
      <div class="sc"><div class="slbl">vs Lg Avg</div><div class="sval" style="color:${parseFloat(diffAvg)>=0?'var(--green)':'var(--red)'}">${diffSign}${diffAvg}</div><div class="sctx">avg: ${lgAvg}</div></div>
      <div class="sc"><div class="slbl">Comp Runs</div><div class="sval">${p.competitive_runs||'—'}</div><div class="sctx">counted</div></div>
      <div class="sc"><div class="slbl">Bolts</div><div class="sval" style="color:var(--gold)">${p.bolts||'—'}</div><div class="sctx">max effort</div></div>
      <div class="sc"><div class="slbl">HP → 1B</div><div class="sval">${p.hp_to_1b||'—'}</div><div class="sctx">seconds</div></div>
    </div>

    <div class="card">
      <div class="stitle">Percentile Rank — ${curSeason}</div>
      <div class="pct-track"><div class="pct-marker" style="left:${pctL}%"></div></div>
      <div class="pct-labels"><span>1st</span><span>25th</span><span>50th</span><span>75th</span><span>99th</span></div>
      <div class="pct-val ${sc}">${pct}th PERCENTILE</div>
    </div>

    ${fullTrend.length > 1 ? `
    <div class="card">
      <div class="stitle">Career Sprint Speed Trend — All Years</div>
      <div class="chart-wrap"><canvas id="trend-cv"></canvas></div>
    </div>` : ''}

    ${rangedTrend.length ? `
    <div class="card">
      <div class="stitle">Season Breakdown — ${yrFrom}–${yrTo}</div>
      ${seasonTableHTML}
    </div>` : ''}
  `;

  if (fullTrend.length > 1) {
    setTimeout(() => drawTrend('trend-cv', [{ data: fullTrend, color: COLORS[0], label: p.name }]), 50);
  }
}

// ── COMPARE ───────────────────────────────────────────────────────────────────
function toggleCompare(p) {
  const idx = compareList.findIndex(c => c.player_id === p.player_id);
  if (idx >= 0) compareList.splice(idx, 1);
  else { if (compareList.length >= 4) compareList.shift(); compareList.push(p); }
  updateCmpBar(); renderList();
}

function updateCmpBar() {
  const bar = document.getElementById('cmp-bar');
  const pills = document.getElementById('cmp-pills');
  if (!compareList.length) { bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  pills.innerHTML = compareList.map(p =>
    `<div class="cmp-pill">${p.name.split(' ').slice(-1)[0]}<button onclick="rmCompare('${p.player_id}')">✕</button></div>`
  ).join('');
}

function rmCompare(id) { compareList = compareList.filter(c => c.player_id !== id); updateCmpBar(); renderList(); }

document.getElementById('btn-clr').addEventListener('click', () => { compareList = []; updateCmpBar(); renderList(); });
document.getElementById('btn-cgo').addEventListener('click', async () => {
  if (compareList.length < 2) return;
  selPlayer = null; isCompare = true; renderList();
  await renderCompare();
});

async function renderCompare() {
  const panel = document.getElementById('right');
  panel.innerHTML = '<div class="loading" style="padding:60px"><div class="spin"></div> Loading comparison…</div>';

  // Always fetch full career trends
  const trends = await Promise.all(
    compareList.map(p => apiFetch(`/api/player?id=${p.player_id}&season=2026`)
      .then(d => d.season_trend || [])
      .catch(() => []))
  );

  const yrFrom = parseInt(document.getElementById('yr-from').value) || 2015;
  const yrTo   = parseInt(document.getElementById('yr-to').value)   || 2026;
  const rangedTrends = trends.map(t => t.filter(d => d.season >= yrFrom && d.season <= yrTo));

  const n = compareList.length;
  const cols = Array(n).fill('1fr').join(' ');

  const stats = [
    { label:'Sprint Speed', fn: p => p.sprint_speed, fmt: v => v?.toFixed(1), higher:true },
    { label:'Percentile',   fn: p => p.percentile,   fmt: v => v ? Math.round(v)+'th':'—', higher:true },
    { label:'Rank',         fn: p => p.rank,          fmt: v => '#'+v, higher:false },
    { label:'Comp Runs',    fn: p => p.competitive_runs, fmt: v => v||'—', higher:true },
    { label:'Bolts',        fn: p => p.bolts,         fmt: v => v||'—', higher:true },
    { label:'HP → 1B',      fn: p => p.hp_to_1b,      fmt: v => v||'—', higher:false },
    { label:'vs Lg Avg',    fn: p => p.sprint_speed ? +(p.sprint_speed-lgAvg).toFixed(1):null, fmt: v => v!=null?(v>=0?'+':'')+v:'—', higher:true },
    { label:'Age',          fn: p => p.age,           fmt: v => v||'—', higher:null },
    { label:'Position',     fn: p => p.position,      fmt: v => v||'—', higher:null },
  ];

  const hdrs = compareList.map((p,i) => `
    <div class="cmp-pcol">
      <div class="cmp-name" style="color:${COLORS[i]}">${p.name}</div>
      <div class="cmp-spd ${spClass(p.sprint_speed)}">${p.sprint_speed?.toFixed(1)}</div>
      <div class="cmp-meta">${p.team} · ${p.position||'—'} · #${p.rank}</div>
    </div>`).join('');

  const statRows = stats.map(st => {
    const vals = compareList.map(p => st.fn(p));
    const numVals = vals.filter(v => typeof v === 'number');
    const best = numVals.length ? (st.higher===true ? Math.max(...numVals) : st.higher===false ? Math.min(...numVals) : null) : null;
    const cells = vals.map((v,i) => {
      let cls = '';
      if (best!==null && v===best) cls='win';
      else if (best!==null && typeof v==='number') cls='los';
      return `<div class="cmp-sv ${cls}">${st.fmt(v,compareList[i])}</div>`;
    }).join('');
    return `<div class="cmp-srow" style="grid-template-columns:120px ${cols}">
      <div class="cmp-slbl">${st.label}</div>${cells}</div>`;
  }).join('');

  const trendDatasets = compareList.map((p,i) => ({ data: trends[i], color: COLORS[i], label: p.name })).filter(d => d.data.length > 1);
  const rangedDatasets = compareList.map((p,i) => ({ data: rangedTrends[i], color: COLORS[i], label: p.name })).filter(d => d.data.length > 1);

  panel.innerHTML = `
    <div class="card ab">
      <div class="stitle">COMPARISON — ${curSeason}</div>
      <div class="cmp-hdr-grid" style="grid-template-columns:${cols}">${hdrs}</div>
      ${statRows}
    </div>

    ${trendDatasets.length >= 2 ? `
    <div class="card ab">
      <div class="stitle">Career Sprint Speed — All Years</div>
      <div class="chart-wrap" style="height:180px"><canvas id="cmp-all-cv"></canvas></div>
      <div style="display:flex;gap:16px;justify-content:center;margin-top:10px;flex-wrap:wrap">
        ${compareList.map((p,i)=>`<div style="display:flex;align-items:center;gap:6px;font-family:'DM Mono',monospace;font-size:11px;color:${COLORS[i]}"><div style="width:20px;height:2px;background:${COLORS[i]}"></div>${p.name}</div>`).join('')}
      </div>
    </div>` : ''}

    ${rangedDatasets.length >= 2 ? `
    <div class="card ab">
      <div class="stitle">Sprint Speed Trend — ${yrFrom}–${yrTo}</div>
      <div class="chart-wrap" style="height:180px"><canvas id="cmp-range-cv"></canvas></div>
    </div>` : ''}

    <div style="text-align:center;color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;padding:4px 0">
      <span style="color:var(--green)">■</span> Best &nbsp; <span style="color:var(--muted)">■</span> Lower
    </div>
  `;

  setTimeout(() => {
    if (trendDatasets.length >= 2) drawTrend('cmp-all-cv', trendDatasets, true);
    if (rangedDatasets.length >= 2) drawTrend('cmp-range-cv', rangedDatasets, true);
  }, 50);
}

// ── CHART ─────────────────────────────────────────────────────────────────────
function drawTrend(canvasId, datasets, multiLine = false) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.offsetWidth || 600, h = canvas.offsetHeight || 150;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const pad = {top:22,right:16,bottom:28,left:42};
  const cw = w-pad.left-pad.right, ch = h-pad.top-pad.bottom;

  const allSpeeds = datasets.flatMap(d => d.data.map(x => x.sprint_speed));
  const allSeasons = datasets.flatMap(d => d.data.map(x => x.season));
  if (!allSpeeds.length) return;
  const minS = Math.min(...allSpeeds)-0.5, maxS = Math.max(...allSpeeds)+0.5;
  const minYr = Math.min(...allSeasons), maxYr = Math.max(...allSeasons);

  const sx = yr => pad.left + ((yr-minYr)/Math.max(1,maxYr-minYr))*cw;
  const sy = v  => pad.top  + ch - ((v-minS)/(maxS-minS))*ch;

  // Grid
  ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1;
  for (let i=0;i<=4;i++) {
    const y=pad.top+(i/4)*ch;
    ctx.beginPath(); ctx.moveTo(pad.left,y); ctx.lineTo(pad.left+cw,y); ctx.stroke();
  }

  // Lg avg line
  if (lgAvg>minS && lgAvg<maxS) {
    const ay=sy(lgAvg);
    ctx.setLineDash([4,4]); ctx.strokeStyle='rgba(255,152,0,0.35)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(pad.left,ay); ctx.lineTo(pad.left+cw,ay); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,152,0,0.6)'; ctx.font='9px DM Mono,monospace';
    ctx.textAlign='left'; ctx.fillText('AVG',pad.left+4,ay-3);
  }

  datasets.forEach((ds) => {
    const data=ds.data, color=ds.color;
    if (data.length<2) return;

    if (!multiLine) {
      const grad=ctx.createLinearGradient(0,pad.top,0,pad.top+ch);
      grad.addColorStop(0,'rgba(0,229,255,0.2)'); grad.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=grad;
      ctx.beginPath();
      ctx.moveTo(sx(data[0].season),sy(data[0].sprint_speed));
      data.forEach(d=>ctx.lineTo(sx(d.season),sy(d.sprint_speed)));
      ctx.lineTo(sx(data[data.length-1].season),pad.top+ch);
      ctx.lineTo(sx(data[0].season),pad.top+ch);
      ctx.closePath(); ctx.fill();
    }

    ctx.strokeStyle=color; ctx.lineWidth=2; ctx.lineJoin='round'; ctx.setLineDash([]);
    ctx.beginPath();
    data.forEach((d,i)=>i===0?ctx.moveTo(sx(d.season),sy(d.sprint_speed)):ctx.lineTo(sx(d.season),sy(d.sprint_speed)));
    ctx.stroke();

    data.forEach(d => {
      const x=sx(d.season),y=sy(d.sprint_speed);
      ctx.fillStyle=color;
      ctx.beginPath(); ctx.arc(x,y,multiLine?3:4,0,Math.PI*2); ctx.fill();
      if (!multiLine) {
        ctx.fillStyle='rgba(232,234,240,0.85)';
        ctx.font='500 10px Barlow Condensed,sans-serif';
        ctx.textAlign='center';
        ctx.fillText(d.sprint_speed.toFixed(1),x,y-9);
      }
    });
  });

  // X axis
  ctx.fillStyle='rgba(107,115,133,0.8)'; ctx.font='9px DM Mono,monospace'; ctx.textAlign='center'; ctx.setLineDash([]);
  const yrRange=maxYr-minYr;
  const uniqueSeasons=[...new Set(datasets.flatMap(d=>d.data.map(x=>x.season)))].sort();
  uniqueSeasons.forEach(yr=>{
    if (yrRange>6 && (yr-minYr)%2!==0) return;
    ctx.fillText(yr,sx(yr),pad.top+ch+17);
  });

  // Y axis
  ctx.textAlign='right';
  for (let i=0;i<=4;i++) {
    const v=minS+((maxS-minS)*(4-i)/4);
    ctx.fillText(v.toFixed(1),pad.left-5,pad.top+(i/4)*ch+4);
  }
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function spClass(s) {
  if(!s) return 'sv';
  if(s>=30) return 'se'; if(s>=28.5) return 'sp'; if(s>=27.5) return 'sa';
  if(s>=26) return 'sv'; if(s>=24.5) return 'sb'; return 'ss';
}
function barColor(s) {
  if(!s) return '#6b7385';
  if(s>=30) return '#00e676'; if(s>=28.5) return '#76ff03'; if(s>=27.5) return '#c6ff00';
  if(s>=26) return '#e8eaf0'; if(s>=24.5) return '#ff9800'; return '#ff5252';
}
function spTier(s) {
  if(!s) return '—';
  if(s>=30) return 'ELITE'; if(s>=28.5) return 'PLUS'; if(s>=27.5) return 'ABOVE AVG';
  if(s>=26) return 'AVERAGE'; if(s>=24.5) return 'BELOW AVG'; return 'SLOW';
}
async function apiFetch(path) {
  const r = await fetch(API+path);
  if(!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

// ── EVENTS ────────────────────────────────────────────────────────────────────
document.getElementById('srch').addEventListener('input', applyFilters);
document.getElementById('pos-f').addEventListener('change', applyFilters);
document.getElementById('tier-btns').addEventListener('click', e => {
  const b=e.target.closest('.tf'); if(!b) return;
  document.querySelectorAll('.tf').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); applyFilters();
});
document.getElementById('btn-apply').addEventListener('click', () => {
  if (selPlayer) renderDetail(selPlayer);
  else if (isCompare) renderCompare();
});

init();
</script>
